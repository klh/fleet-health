# compose.yaml — WIRING ONLY. One sidecar example; the demo stack (3
# buckles + engines + sidecars) lives in fleet-buckle's compose.test.yaml.
services:
  health1:
    build: ..
    environment:
      HEALTH_SETTINGS: /etc/health/settings.json5
    volumes:
      - ./settings/h1.settings.json5:/etc/health/settings.json5:ro
    ports:
      - "4112:4112"
