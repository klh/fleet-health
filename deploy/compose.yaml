# compose.yaml — wiring-only example of ONE generic sidecar. The
# consumer's stack owns instance settings; this mounts the example.
services:
  health:
    build: ..
    environment:
      HEALTH_SETTINGS: /etc/health/settings.json5
    volumes:
      - ./settings/example.settings.json5:/etc/health/settings.json5:ro
    ports:
      - "8081:8081"
